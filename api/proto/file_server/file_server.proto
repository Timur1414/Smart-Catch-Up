syntax = "proto3";

package file_server;

option go_package = "github.com/Timur1414/Smart-Catch-Up/api/proto/file_server;file_serverpb";

service FileServer {
  rpc SaveFile(SaveFileRequest) returns (SaveFileResponse);
}

message SaveFileRequest {
  bytes data = 1;
  string extension = 2;
}

message SaveFileResponse {
  string filename = 1;
}
