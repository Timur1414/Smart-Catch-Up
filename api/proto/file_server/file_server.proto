syntax = "proto3";

package file_server;

option go_package = "github.com/Timur1414/Smart-Catch-Up/api/proto/file_server;file_serverpb";

service FileServer {
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse);
}

message UploadAvatarRequest {
  bytes data = 1;
  string extension = 2;
}

message UploadAvatarResponse {
  string filename = 1;
}
