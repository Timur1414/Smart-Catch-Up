common:
  debug: true
  front_url: "http://localhost:5173"
  extension_url: "chrome-extension://pfekhfkigjonhiheikggociceocdcdcb"
  digest_cache_ttl: "24h"
  digest_cache_prefix: "cache:digest:"
  access_token_expiration_time: "5m"
  refresh_token_expiration_time: "168h"

aggregator:
  log_prefix: "aggregator"
  batch_size: 500
  worker_count: 4
  interval: "1m"
  postgres:
    ssl_mode: "disable"
    max_conns: 50
    min_conns: 10
    max_conn_lifetime: "1h"
  redis:
    db: 0
  proxy:
    on: false
    scheme: "socks5"

api_gateway:
  log_prefix: "api"
  auth_target: "auth:50051"
  generator_target: "generator:50051"
  fileserver_target: "fileserver:50051"
  port: "8080"
  read_timeout: "10s"
  write_timeout: "120s"
  access_token_name: "access_token"
  refresh_token_name: "refresh_token"
  extension_user_id: 2
  max_avatar_size: 5242880
  count_raw_notifications: 10
  postgres:
    ssl_mode: "disable"
    max_conns: 50
    min_conns: 10
    max_conn_lifetime: "1h"
  redis:
    db: 0
  csrf:
    header_name: "X-CSRF-Token"
    cookie_name: "__Host-csrf_token"
    cookie_expiration_time: "5m"

auth:
  log_prefix: "auth"
  port: "50051"
  refresh_token_prefix: "auth:refresh:"
  two_factor_flow_prefix: "auth:2fa:flow:"
  two_factor_attempts_prefix: "auth:2fa:attempts:"
  two_factor_token_expiration_time: "3m"
  used_code_prefix: "auth:2fa:used:"
  used_code_expiration_time: "90s"
  access_token_type: "auth_access_token"
  refresh_token_type: "auth_refresh_token"
  temp_token_type: "auth_temp_token"
  postgres:
    ssl_mode: "disable"
    max_conns: 50
    min_conns: 10
    max_conn_lifetime: "1h"
  redis:
    db: 0

fileserver:
  log_prefix: "fileserver"
  port: "50051"
  static_dir: "static"

generator:
  log_prefix: "generator"
  port: "50051"
  postgres:
    ssl_mode: "disable"
    max_conns: 50
    min_conns: 10
    max_conn_lifetime: "1h"
