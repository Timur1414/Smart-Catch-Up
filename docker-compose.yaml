services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-logs:/var/log/postgresql
    networks:
      - scu-network

  redis:
    image: redis:8.8.3-alpine3.23
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - scu-network

  migrations:
    image: ghcr.io/jackc/tern:latest
    container_name: postgres-migrations
    volumes:
      - ./migrations:/migrations
    working_dir: /migrations
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - scu-network

  seed:
    image: timur1414/scu-seed:latest
    container_name: seed
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: no
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  fileserver:
    image: timur1414/scu-fileserver:latest
    container_name: fileserver
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "50053"
    volumes:
      - ./log:/app/log
      - ./static:/app/static
    env_file:
      - .env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  aggregator:
    image: timur1414/scu-aggregator:latest
    container_name: aggregator
    restart: always
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 77.88.8.8
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  generator:
    image: timur1414/scu-generator:latest
    container_name: generator
    restart: always
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "50052"
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  auth:
    image: timur1414/scu-auth:latest
    container_name: auth
    restart: always
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "50051"
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  api-gateway:
    image: timur1414/scu-api-gateway:latest
    container_name: api-gateway
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      auth:
        condition: service_started
      generator:
        condition: service_started
      aggregator:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=60
      - REPO_USER=${DOCKERHUB_USERNAME}
      - REPO_PASS=${DOCKERHUB_PASSWORD}
    networks:
      - scu-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  scu-network:
    name: scu-network
    driver: bridge
